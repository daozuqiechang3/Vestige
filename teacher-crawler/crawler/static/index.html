<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>网页采集工具</title>
<style>
:root{color-scheme:light;--ink:#18212b;--muted:#687481;--bg:#fffdf9;--primary:#dbe7ef;--accent:#e9dfd2;--line:#d5dfe4;--white:#fff;--danger:#a43a3a;--low:#7b8490;--warning:#995314;--warning-bg:#fff2df}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px "Microsoft YaHei","PingFang SC",Arial,sans-serif;letter-spacing:0}button,input,select,textarea{font:inherit;letter-spacing:0}header{background:var(--accent);border-bottom:4px solid var(--primary)}.header-inner,main{width:100%;margin:0}.header-inner{min-height:72px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{margin:0;font-size:22px}h2{margin:0 0 16px;font-size:16px}section{padding:22px 24px;border-bottom:1px solid var(--line)}.task-form{display:grid;grid-template-columns:minmax(280px,1fr) 150px auto auto;gap:12px;align-items:end}label{display:grid;gap:7px;font-weight:600}input,select,textarea{width:100%;height:40px;border:1px solid var(--line);border-radius:4px;padding:0 11px;color:var(--ink);background:var(--white);outline:0}textarea{height:80px;padding:7px;resize:vertical}button,.download-link{min-height:40px;border:1px solid var(--primary);border-radius:4px;padding:9px 15px;background:var(--primary);color:var(--ink);text-decoration:none;cursor:pointer;font-weight:600;white-space:nowrap}button:hover,.download-link:hover{background:var(--accent);border-color:var(--accent)}button:disabled{color:var(--muted);cursor:not-allowed}.status-line,.results-head,.pagination{display:flex;align-items:center;justify-content:space-between;gap:16px}.status-badge{display:inline-flex;padding:5px 10px;border-radius:3px;background:var(--primary);font-weight:700}.metrics{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--line)}.metric{min-height:74px;padding:13px 16px;border-right:1px solid var(--line)}.metric:last-child{border:0}.metric span{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.metric strong{font-size:22px}.progress-track{height:8px;margin-top:14px;overflow:hidden;background:var(--accent);border-radius:3px}.progress-bar{height:100%;width:0;background:#9ebdce;transition:width .2s}.progress-detail{margin-top:7px}.log-panel{height:170px;overflow:auto;margin:0;padding:14px;background:#edf2f4;border-radius:4px;font:12px/1.65 Consolas,"Microsoft YaHei",monospace;white-space:pre-wrap}.download-actions,.checks{display:flex;gap:8px;flex-wrap:wrap}.filters{display:grid;grid-template-columns:1.5fr repeat(3,minmax(130px,.7fr)) auto;gap:10px;align-items:end;margin:14px 0}.checks{margin-bottom:14px}.checks label{display:inline-flex;align-items:center;gap:6px;font-weight:500}.checks input,.favorite-input{width:16px;height:16px}.table-wrap{overflow-x:auto;border:1px solid var(--line)}table{width:100%;min-width:1380px;border-collapse:collapse}th,td{min-width:120px;padding:11px 13px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);word-break:break-word}th{background:#edf2f4;font-size:12px}.acl-table{min-width:1765px;table-layout:fixed}.acl-table th,.acl-table td{min-width:0}.acl-table th:nth-child(1){width:260px}.acl-table th:nth-child(2),.acl-table th:nth-child(3){width:480px}.acl-table th:nth-child(4){width:75px}.acl-table th:nth-child(5){width:90px}.acl-table th:nth-child(6){width:105px}.acl-table th:nth-child(7){width:150px}.acl-table th:nth-child(8){width:125px}.paper-title{font-weight:650;line-height:1.55}.paper-summary{max-height:320px;overflow:auto;white-space:pre-wrap;line-height:1.7;word-break:break-word;padding-right:5px}.translation-warning{display:block;margin-top:8px;padding:5px 7px;border-left:3px solid #e3a052;background:var(--warning-bg);color:var(--warning);font-size:12px;line-height:1.45}.clip{max-width:360px;line-height:1.55;word-break:break-word}.muted,.low{color:var(--muted);font-size:12px}.low{color:var(--low)}.signal{display:inline-block;margin:0 4px 4px 0;padding:2px 6px;background:var(--accent);border-radius:3px;font-size:12px}.save-button,.retry-button{min-height:32px;padding:5px 10px;margin-top:6px}.empty{text-align:center;color:var(--muted);padding:28px}.error{margin-top:12px;color:var(--danger);font-weight:600}.failure-url{overflow-wrap:anywhere}.failure-error{color:var(--danger);font-size:12px;line-height:1.5}.pagination{justify-content:flex-end;margin-top:12px}.pagination button{min-height:34px;padding:5px 12px}[hidden]{display:none!important}.detail{position:fixed;z-index:5;inset:0;background:rgba(24,33,43,.48);display:grid;place-items:center;padding:18px}.detail-inner{width:min(960px,100%);max-height:calc(100vh - 36px);overflow:auto;background:var(--bg);border:1px solid var(--line);padding:24px}.detail-head{display:flex;justify-content:space-between;gap:16px;align-items:start}.detail-block{margin-top:18px}.detail-block h3{font-size:14px;margin:0 0 8px}.detail-text{max-height:280px;overflow:auto;white-space:pre-wrap;line-height:1.7;padding:12px;background:#edf2f4;word-break:break-word}.clickable{cursor:pointer}.clickable:hover{background:#faf3ea}
@media(max-width:720px){.header-inner{min-height:64px;padding:12px 14px;align-items:flex-start;flex-direction:column;gap:3px}section{padding:18px 14px}.task-form,.filters{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.metric:nth-child(even){border-right:0}.metric{border-bottom:1px solid var(--line)}.metric:nth-last-child(-n+2){border-bottom:0}.results-head{align-items:stretch;flex-direction:column}.download-actions{display:grid}.download-link{text-align:center}.detail{padding:8px}.detail-inner{padding:16px;max-height:calc(100vh - 16px)}}
</style></head>
<body><header><div class="header-inner"><h1>网页采集工具</h1><label>工作模式<select id="mode"><option value="teacher">导师信息采集 / 教师信息采集</option><option value="acl">论文采集（ACL / ACM）</option><option value="openreview">论文采集（OpenReview）</option></select></label></div></header><main>
<section><form id="task-form" class="task-form"><label id="url-label">教师列表页 URL<input id="url" type="url" required value="https://cs.bit.edu.cn/szdw/jsml/index.htm"></label><label id="limit-label">采集上限<input id="limit" type="text" inputmode="numeric" pattern="[1-9][0-9]*" maxlength="4" placeholder="不限"></label><button id="start" type="submit">开始采集</button><button id="force" type="button">强制全部重新爬取</button></form><div id="form-error" class="error" hidden></div><p class="muted">任务结果保存在服务端，浏览器仅记录当前任务。</p></section>
<section id="openreview-import" hidden><div class="results-head"><h2>OpenReview 浏览器验证导入</h2><span id="import-state" class="muted"></span></div><p class="muted">接口需要浏览器验证时，在 OpenReview 页面复制分组页 HTML 或论文快照 JSON，再分批导入。</p><label>分组页 HTML / 论文 URL JSON<textarea id="discovery-input" placeholder='["https://openreview.net/forum?id=..."] 或粘贴分组页 HTML'></textarea></label><div class="download-actions"><button id="import-discovery" type="button">导入发现结果</button></div><label>论文快照 JSON<textarea id="papers-input" placeholder='[{"url":"https://openreview.net/forum?id=...","html":"..."}]'></textarea></label><div class="checks"><label><input id="import-complete" type="checkbox">本批包含全部待采集论文</label><button id="import-papers" type="button">导入论文快照</button></div><div id="import-error" class="error" hidden></div></section>
<section><div class="status-line"><h2>任务进度</h2><span id="status" class="status-badge">等待任务</span></div><div class="metrics"><div class="metric"><span>发现</span><strong id="discovered">0</strong></div><div class="metric"><span>成功</span><strong id="processed">0</strong></div><div class="metric"><span>失败</span><strong id="failed">0</strong></div><div class="metric"><span>跳过</span><strong id="skipped">0</strong></div><div class="metric"><span>待采集</span><strong id="pending">0</strong></div><div class="metric"><span>翻译告警</span><strong id="warnings">0</strong></div></div><div class="progress-track"><div id="progress" class="progress-bar"></div></div><div id="progress-detail" class="muted progress-detail"></div></section>
<section><h2>运行日志</h2><pre id="logs" class="log-panel">尚未启动任务。</pre></section>
<section id="failure-section" hidden><div class="results-head"><h2 id="failure-title">失败条目</h2><button id="retry-all" type="button">全部重试失败项</button></div><div class="table-wrap"><table style="min-width:760px"><thead><tr><th>名称 / URL</th><th>失败原因</th><th>操作</th></tr></thead><tbody id="failure-results"></tbody></table></div></section>
<section><div class="results-head"><h2 id="results-title">导师筛选</h2><div class="download-actions"><a id="csv-download" class="download-link" hidden>下载 CSV</a><a id="zip-download" class="download-link" hidden>下载全部原始文件 ZIP</a></div></div><form id="filter-form" class="filters"><label>搜索<input id="query" type="search" placeholder="姓名、方向、实验室、招生原文"></label><label id="status-filter-wrap">采集状态<select id="paper-status-filter"><option value="">全部</option><option value="success">采集成功</option><option value="fail">采集失败</option><option value="pending">待采集</option></select></label><label id="recruit-type-wrap">招生类型<select id="recruit-type"><option value="">全部</option><option value="internship">实习</option><option value="graduate">硕博 / 推免</option><option value="contact">欢迎联系</option></select></label><label id="contact-filter-wrap">联系状态<select id="contact-filter"><option value="">全部</option><option>未联系</option><option>待联系</option><option>已发邮件</option><option>已回复</option><option>暂不考虑</option></select></label><label>排序<select id="sort"></select></label><button type="submit">应用筛选</button></form><div class="checks"><label id="has-recruit-wrap"><input id="has-recruit" type="checkbox">仅有招生信息</label><label id="has-email-wrap"><input id="has-email" type="checkbox">仅有邮箱</label><label><input id="favorite-filter" type="checkbox">仅收藏</label></div><div id="result-count" class="muted">任务完成后显示结果</div><div class="table-wrap"><table id="result-table"><thead id="result-head"></thead><tbody id="results"><tr><td class="empty" colspan="8">任务完成后显示结果</td></tr></tbody></table></div><div id="pagination" class="pagination" hidden><button id="page-prev" type="button">上一页</button><span id="page-label" class="muted"></span><button id="page-next" type="button">下一页</button></div></section></main>
<div id="detail" class="detail" hidden><div class="detail-inner"><div class="detail-head"><div><h2 id="detail-title"></h2><div id="detail-url" class="muted"></div></div><button id="detail-close" type="button">关闭</button></div><div id="detail-content"></div></div></div>
<script>
const $=s=>document.querySelector(s);let currentTask=null,pollTimer=null,pageOffset=0,resultsRequest=0;const PAGE_SIZE=25;const labels={queued:'等待执行',running:'正在采集',retrying:'正在重试',paused:'任务暂停',awaiting_browser:'等待浏览器验证',completed:'采集完成',completed_with_errors:'采集完成（有失败）',failed:'任务失败'};
function mode(){return $('#mode').value}function setError(x){$('#form-error').textContent=x||'';$('#form-error').hidden=!x}function text(p,x,c=''){const n=document.createElement('div');n.textContent=x||'';if(c)n.className=c;p.append(n);return n}function empty(msg,cols=8){$('#results').innerHTML=`<tr><td class="empty" colspan="${cols}">${msg}</td></tr>`}
function resetUI(){currentTask=null;pageOffset=0;clearInterval(pollTimer);pollTimer=null;localStorage.removeItem('crawlerTask');$('#url').value=mode()==='acl'?'https://aclanthology.org/volumes/2026.acl-long/':mode()==='openreview'?'https://openreview.net/group?id=ICML.cc/2026/Conference#tab-accept-spotlight':'https://cs.bit.edu.cn/szdw/jsml/index.htm';$('#limit').value='';['query','paper-status-filter','recruit-type','contact-filter','sort'].forEach(id=>$('#'+id).value='');['has-recruit','has-email','favorite-filter','import-complete'].forEach(id=>{if($('#'+id))$('#'+id).checked=false});['discovery-input','papers-input'].forEach(id=>{if($('#'+id))$('#'+id).value=''});setError('');if($('#import-error')){$('#import-error').textContent='';$('#import-error').hidden=true}$('#status').textContent='等待任务';['discovered','processed','failed','skipped','pending','warnings'].forEach(id=>$('#'+id).textContent='0');$('#progress').style.width='0%';$('#progress-detail').textContent='';$('#logs').textContent='尚未启动任务。';$('#failure-section').hidden=true;$('#result-count').textContent='任务完成后显示结果';$('#start').disabled=false;$('#start').textContent='开始采集';$('#force').disabled=false;$('#force').title='';$('#csv-download').hidden=$('#zip-download').hidden=true;$('#pagination').hidden=true;empty('任务完成后显示结果');updateLabels()}
function updateLabels(){const acl=mode()==='acl';const openreview=mode()==='openreview';const paper=acl||openreview;$('#result-table').classList.toggle('acl-table',paper);$('#url-label').firstChild.textContent=paper?'ACL / ACM / ICLR / OpenReview 论文合集、分组或详情页 URL':'教师列表页 URL';$('#limit-label').firstChild.textContent=paper?'成功论文上限':'采集上限';$('#url').placeholder=openreview?'OpenReview 分组页或 forum 详情页 URL':paper?'ACL 文集页、ICLR 合集页，或带 #heading2 的 ACM proceedings URL':'';$('#results-title').textContent=paper?'论文列表':'导师筛选';$('#failure-title').textContent=paper?'失败论文':'失败教师';$('#query').placeholder=paper?'标题、作者、摘要关键词搜索':'姓名、方向、实验室、招生原文';$('#status-filter-wrap').hidden=!paper;$('#recruit-type-wrap').hidden=paper;$('#contact-filter-wrap').hidden=paper;$('#has-recruit-wrap').hidden=paper;$('#has-email-wrap').hidden=paper;$('#openreview-import').hidden=!openreview;$('#sort').innerHTML=paper?'<option value="default:asc">默认顺序</option><option value="title:asc">标题A-Z</option><option value="collected_at:desc">采集时间优先</option>':'<option value="recruit_score:desc">招生信号优先</option><option value="name:asc">姓名升序</option><option value="title:asc">职称升序</option><option value="research_dir:asc">研究方向升序</option>';$('#result-head').innerHTML=paper?'<tr><th>中文标题 / English Title</th><th>英文摘要 / 失败原因</th><th>中文摘要</th><th>PDF</th><th>状态</th><th>解析模式</th><th>收藏 / 编辑</th><th>原始网页</th></tr>':'<tr><th>收藏</th><th>教师 / 职称</th><th>研究方向 / 实验室</th><th>邮箱</th><th>招生信号</th><th>联系状态 / 备注</th><th>来源 / 文件</th></tr>'}
function renderFailures(list,busy){$('#failure-section').hidden=!list.length;$('#retry-all').disabled=busy;const root=$('#failure-results');root.replaceChildren();list.forEach(f=>{const r=document.createElement('tr'),a=document.createElement('td'),b=document.createElement('td'),c=document.createElement('td');const link=document.createElement('a');link.href=f.profile_url;link.target='_blank';link.rel='noreferrer';link.className='failure-url';link.textContent=f.name||f.profile_url;a.append(link);b.textContent=f.error||'未知错误';b.className='failure-error';const button=document.createElement('button');button.className='retry-button';button.textContent='重试';button.disabled=busy;button.onclick=()=>retry(f.profile_url);c.append(button);r.append(a,b,c);root.append(r)})}
function renderTeacher(t){const r=document.createElement('tr'),fav=document.createElement('input');fav.type='checkbox';fav.checked=t.favorite;fav.className='favorite-input';const f=document.createElement('td');f.append(fav);const i=document.createElement('td');text(i,t.name,'teacher-name');text(i,t.title||'职称未提取','muted');const d=document.createElement('td');text(d,t.research_dir||'研究方向未提取','clip');if(t.lab)text(d,'实验室：'+t.lab,'muted');const e=document.createElement('td');if(t.email){const a=document.createElement('a');a.href='mailto:'+t.email;a.textContent=t.email;e.append(a)}else text(e,'未提取','muted');const s=document.createElement('td');text(s,t.recruit_text||'未命中招生话术','clip');const m=document.createElement('td'),status=document.createElement('select'),note=document.createElement('textarea');['未联系','待联系','已发邮件','已回复','暂不考虑'].forEach(v=>{const o=new Option(v,v);o.selected=v===t.contact_status;status.append(o)});note.value=t.note||'';note.placeholder='匹配度、邮件和回复情况';const save=document.createElement('button');save.className='save-button';save.textContent='保存标记';save.onclick=async()=>{await fetch(`/api/tasks/${currentTask.id}/research/${t.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({note:note.value,contact_status:status.value,favorite:fav.checked})});save.textContent='已保存';setTimeout(()=>save.textContent='保存标记',1000)};m.append(status,note,save);const src=document.createElement('td');const home=document.createElement('a');home.href=t.homepage_url;home.target='_blank';home.textContent='原始主页';src.append(home);if(t.download_url){const dl=document.createElement('a');dl.href=t.download_url;dl.textContent='下载 Word';src.append(document.createElement('br'),dl)};r.append(f,i,d,e,s,m,src);r.onclick=ev=>{if(!['INPUT','SELECT','TEXTAREA','BUTTON','A'].includes(ev.target.tagName))showDetail(t)};return r}
async function patchPaper(p,body){const u=encodeURIComponent(p.url.replace(/^https?:\/\//,'')),response=await fetch(`/api/tasks/${currentTask.id}/papers/${u}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),updated=await response.json();if(!response.ok)throw Error(updated.detail||'论文保存失败');Object.assign(p,updated);return updated}
function renderPaper(p){const success=p.status==='success',r=document.createElement('tr'),title=document.createElement('td'),titleFailed=success&&(p.title_translation_failed||!p.title_zh||p.title_zh==='翻译失败');text(title,success?(titleFailed?(p.title_en||p.title):p.title_zh):(p.url||'未知论文'),'paper-title');if(success){text(title,'英文：'+(p.title_en||p.title||'标题未提取'),'muted');if((p.authors||[]).length)text(title,(p.authors||[]).join('、'),'muted');if(p.venue||p.decision)text(title,[p.venue,p.decision].filter(Boolean).join(' · '),'muted');if(titleFailed)text(title,'标题自动翻译失败，已保留英文','translation-warning')}const en=document.createElement('td');text(en,success?(p.abstract_en||'无摘要'):(p.error||'尚未采集'),'paper-summary');if(success&&p.tldr)text(en,'TL;DR：'+p.tldr,'muted');const zh=document.createElement('td');if(success){text(zh,p.abstract_zh==='翻译失败'?p.abstract_en:p.abstract_zh,'paper-summary');if(p.translation_failed||p.abstract_zh==='翻译失败')text(zh,'自动翻译失败，请手动编辑','translation-warning')}else text(zh,'-','muted');const pdf=document.createElement('td');if(p.pdf_url){const a=document.createElement('a');a.href=p.pdf_url;a.target='_blank';a.rel='noreferrer';a.textContent='PDF';pdf.append(a)}else text(pdf,'未找到','muted');const statusNames={success:'成功',fail:'失败',pending:'待采集',running:'采集中',skipped:'跳过'},st=document.createElement('td');st.textContent=statusNames[p.status]||p.status;const pm=document.createElement('td');pm.textContent=p.parser_mode||'-';if(!pm.textContent.includes('专用解析')&&!pm.textContent.includes('OpenReview'))pm.className='low';const edit=document.createElement('td');if(success){const fav=document.createElement('input');fav.type='checkbox';fav.checked=Boolean(p.favorite);fav.className='favorite-input';fav.title='收藏';fav.onchange=async()=>{try{await patchPaper(p,{favorite:fav.checked})}catch(e){fav.checked=!fav.checked;setError(e.message)}};const b=document.createElement('button');b.className='save-button';b.textContent='编辑中文摘要';b.onclick=()=>showDetail(p);edit.append(fav,b)}const raw=document.createElement('td');if(p.raw_available){const a=document.createElement('a');a.href=`/api/tasks/${currentTask.id}/papers/raw?url=${encodeURIComponent(p.url)}`;a.textContent='下载原始网页';raw.append(a)}else text(raw,'不可用','muted');r.append(title,en,zh,pdf,st,pm,edit,raw);if(success)r.onclick=ev=>{if(!['INPUT','BUTTON','A'].includes(ev.target.tagName))showDetail(p)};return r}
async function renderResults(task){const root=$('#results');root.replaceChildren();if(mode()!=='acl'&&mode()!=='openreview'){loadTeachers(task.id);$('#pagination').hidden=true;return}const request=++resultsRequest,params=new URLSearchParams({q:$('#query').value.trim(),paper_status:$('#paper-status-filter').value,sort:($('#sort').value||'default:asc').split(':')[0],offset:String(pageOffset),limit:String(PAGE_SIZE),favorite:String($('#favorite-filter').checked)});try{const response=await fetch(`/api/tasks/${task.id}/papers?${params}`),data=await response.json();if(request!==resultsRequest)return;if(!response.ok)throw Error(data.detail||'无法读取论文结果');data.papers.length?data.papers.forEach(p=>root.append(renderPaper(p))):empty('暂无论文结果',8);const start=data.count?data.offset+1:0,end=Math.min(data.offset+data.limit,data.count);$('#result-count').textContent=`共 ${data.count} 篇论文，当前 ${start}-${end}`;$('#pagination').hidden=data.count<=PAGE_SIZE;$('#page-label').textContent=`第 ${Math.floor(data.offset/PAGE_SIZE)+1} 页 / 共 ${Math.max(1,Math.ceil(data.count/PAGE_SIZE))} 页`;$('#page-prev').disabled=data.offset===0;$('#page-next').disabled=data.offset+data.limit>=data.count}catch(e){empty(e.message,8);setError(e.message)}}
async function loadTeachers(id){const q=new URLSearchParams({q:$('#query').value.trim(),recruit_type:$('#recruit-type').value,contact_status:$('#contact-filter').value,sort:$('#sort').value.split(':')[0],order:$('#sort').value.split(':')[1]});if($('#has-recruit').checked)q.set('has_recruit_info','true');if($('#has-email').checked)q.set('has_email','true');if($('#favorite-filter').checked)q.set('favorite','true');const r=await fetch(`/api/tasks/${id}/research?${q}`),x=await r.json();$('#results').replaceChildren();x.teachers.length?x.teachers.forEach(t=>$('#results').append(renderTeacher(t))):empty('没有符合条件的教师',7);$('#result-count').textContent=`共 ${x.count} 位教师`}
function showDetail(item){const paper=mode()==='acl'||mode()==='openreview';const titleFailed=paper&&(item.title_translation_failed||!item.title_zh||item.title_zh==='翻译失败');$('#detail-title').textContent=paper?(titleFailed?(item.title||item.title_en):item.title_zh):item.name;$('#detail-url').textContent=paper?item.url:item.homepage_url;const root=$('#detail-content');root.replaceChildren();if(paper){text(root,'中文标题','detail-block');text(root,titleFailed?(item.title_en||item.title):item.title_zh,'detail-text');if(titleFailed)text(root,'标题自动翻译失败，已保留英文','translation-warning');text(root,'英文标题','detail-block');text(root,item.title_en||item.title,'detail-text');if((item.authors||[]).length){text(root,'作者','detail-block');text(root,item.authors.join('、'),'detail-text')}[['会议 / 决策',[item.venue,item.decision].filter(Boolean).join(' / ')],['TL;DR',item.tldr],['Lay Summary',item.lay_summary],['Primary Area',item.primary_area],['Keywords',(item.keywords||[]).join('、')],['Submission Number',item.submission_number],['Published / Last Modified',[item.published_at,item.modified_at].filter(Boolean).join(' / ')],['Comment',item.decision_comment]].forEach(([label,value])=>{if(value){text(root,label,'detail-block');text(root,value,'detail-text')}});text(root,'英文摘要','detail-block');text(root,item.abstract_en,'detail-text');text(root,'中文摘要','detail-block');if(item.translation_failed||item.abstract_zh==='翻译失败')text(root,'自动翻译失败，请手动编辑','translation-warning');const ta=document.createElement('textarea');ta.className='detail-text';ta.value=item.abstract_zh==='翻译失败'?item.abstract_en:item.abstract_zh;root.append(ta);const save=document.createElement('button');save.textContent='保存中文摘要';save.onclick=async()=>{try{await patchPaper(item,{abstract_zh:ta.value});$('#detail').hidden=true;renderResults(currentTask)}catch(e){setError(e.message)}};root.append(save)}else{text(root,'教师详情','detail-block');text(root,[item.bio,item.recruit_text].filter(Boolean).join('\n\n'),'detail-text')}$('#detail').hidden=false}
$('#detail-close').onclick=()=>$('#detail').hidden=true;$('#mode').onchange=resetUI;
$('#limit').oninput=e=>{e.target.value=e.target.value.replace(/\D/g,'').replace(/^0+/,'').slice(0,4)};
function renderTask(t){currentTask=t;if($('#mode').value!==t.mode){$('#mode').value=t.mode;updateLabels()}try{localStorage.setItem('crawlerTask',JSON.stringify({id:t.id,mode:t.mode,url:t.url,status:t.status,limit:t.limit}))}catch{}if(document.activeElement!==$('#url'))$('#url').value=t.url;const reachedLimit=t.status==='paused'&&t.limit!==null&&(t.counts.processed||0)>=t.limit;$('#status').textContent=reachedLimit?`已达到成功论文上限 ${t.limit}，任务暂停`:labels[t.status]||t.status;$('#discovered').textContent=t.counts.discovered||0;$('#processed').textContent=t.counts.processed||0;$('#failed').textContent=t.counts.failed||0;$('#skipped').textContent=t.counts.skipped||0;$('#pending').textContent=t.counts.pending||0;$('#warnings').textContent=t.counts.warnings||0;$('#progress').style.width=t.progress+'%';const goal=t.limit?Math.min(t.limit,t.counts.discovered||t.limit):(t.counts.discovered||0),scope=[t.school,t.college].filter((v,i,a)=>v&&a.indexOf(v)===i).join(' / '),scopeText=scope?`来源 ${scope}；`:'';$('#progress-detail').textContent=(t.mode==='acl'||t.mode==='openreview')?`${scopeText}目标进度 ${t.counts.processed||0}/${goal}；来源覆盖率 ${t.coverage_progress||0}%`:'';$('#logs').textContent=t.logs?.join('\n')||'任务正在初始化。';setError(t.error||'');const busy=['queued','running','retrying'].includes(t.status);$('#start').disabled=busy;$('#start').textContent=(t.status==='paused'||t.status==='awaiting_browser')?'继续采集':'开始采集';$('#force').disabled=busy||t.force_reset_allowed===false;$('#force').title=t.force_reset_allowed===false?'浏览器快照任务不能强制重抓':'';if(document.activeElement!==$('#limit'))$('#limit').value=t.limit??'';renderFailures(t.failures||[],busy);$('#csv-download').hidden=!t.csv_url;if(t.csv_url){$('#csv-download').href=t.csv_url;$('#csv-download').textContent=(t.mode==='acl'||t.mode==='openreview')?'下载 papers.csv':'下载 teachers.csv'}$('#zip-download').hidden=!t.zip_url;if(t.zip_url)$('#zip-download').href=t.zip_url;const openreview=t.mode==='openreview';$('#openreview-import').hidden=!openreview;$('#import-state').textContent=openreview&&t.status==='awaiting_browser'?'请完成验证后导入页面快照':'';const terminal=['completed','completed_with_errors','paused','awaiting_browser'].includes(t.status);if(terminal)renderResults(t);if(terminal||t.status==='failed'){clearInterval(pollTimer);pollTimer=null}}
async function poll(id){try{const r=await fetch('/api/tasks/'+id),t=await r.json();if(!r.ok)throw Error(t.detail||'无法读取任务');renderTask(t)}catch(e){setError(e.message);clearInterval(pollTimer);pollTimer=null;$('#start').disabled=false}}
function beginPolling(id){clearInterval(pollTimer);pollTimer=setInterval(()=>poll(id),1000);poll(id)}
async function create(force=false){setError('');const rawLimit=$('#limit').value.trim();if(rawLimit&&!/^[1-9]\d*$/.test(rawLimit)){setError('采集上限必须是大于 0 的整数');return}const body={url:$('#url').value.trim(),mode:mode()};if(rawLimit)body.limit=Number(rawLimit);if(!force&&currentTask&&(currentTask.status==='paused'||currentTask.status==='awaiting_browser')&&currentTask.mode===mode()&&currentTask.url===body.url){if(currentTask.status==='paused'&&!rawLimit){setError('请输入新的采集上限');return}const nextLimit=rawLimit?Number(rawLimit):currentTask.limit;if(nextLimit!==null&&nextLimit<=currentTask.counts.processed){setError(`新采集上限必须大于当前成功数 ${currentTask.counts.processed}`);return}const r=await fetch(`/api/tasks/${currentTask.id}/continue`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({limit:nextLimit})});const t=await r.json();if(!r.ok)throw Error(t.detail||'任务继续失败');renderTask(t);beginPolling(t.id);return}const r=await fetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),t=await r.json();if(!r.ok)throw Error(t.detail||'任务创建失败');renderTask(t);beginPolling(t.id)}
$('#task-form').onsubmit=async e=>{e.preventDefault();try{await create()}catch(x){setError(x.message)}};$('#force').onclick=async()=>{if(!currentTask){try{await create(true)}catch(x){setError(x.message)};return}try{const r=await fetch(`/api/tasks/${currentTask.id}/reset`,{method:'POST'}),t=await r.json();if(!r.ok)throw Error(t.detail||'任务重置失败');pageOffset=0;renderTask(t);beginPolling(currentTask.id)}catch(x){setError(x.message)}};$('#filter-form').onsubmit=e=>{e.preventDefault();if(!currentTask)return;pageOffset=0;if(mode()==='acl'||mode()==='openreview')renderResults(currentTask);else loadTeachers(currentTask.id)};$('#favorite-filter').onchange=()=>{if(currentTask&&(mode()==='acl'||mode()==='openreview')){pageOffset=0;renderResults(currentTask)}};$('#page-prev').onclick=()=>{pageOffset=Math.max(0,pageOffset-PAGE_SIZE);renderResults(currentTask)};$('#page-next').onclick=()=>{pageOffset+=PAGE_SIZE;renderResults(currentTask)};$('#retry-all').onclick=()=>retry();async function retry(url=null){if(!currentTask)return;const endpoint=url?`/api/tasks/${currentTask.id}/failures/retry`:`/api/tasks/${currentTask.id}/failures/retry-all`;const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:url?JSON.stringify({profile_url:url}):undefined}),t=await r.json();if(!r.ok){setError(t.detail);return}renderTask(t);beginPolling(t.id)}
function importFailure(message){$('#import-error').textContent=message||'';$('#import-error').hidden=!message}
function readJsonOrHtml(value){const raw=value.trim();if(!raw)throw Error('请先粘贴内容');try{return JSON.parse(raw)}catch{return raw}}
async function importDiscovery(){if(!currentTask||currentTask.mode!=='openreview'){importFailure('请先创建 OpenReview 任务');return}try{const value=readJsonOrHtml($('#discovery-input').value),body={conference:currentTask.school||'OpenReview',session:currentTask.college||'OpenReview',paper_urls:[]};if(typeof value==='string'){body.html=value;body.page_url=currentTask.url}else if(Array.isArray(value)){body.paper_urls=value}else if(value&&typeof value==='object'){body.paper_urls=Array.isArray(value.paper_urls)?value.paper_urls:[];body.html=typeof value.html==='string'?value.html:'';body.page_url=typeof value.page_url==='string'?value.page_url:currentTask.url;body.html_pages=Array.isArray(value.html_pages)?value.html_pages:[]}else throw Error('发现结果必须是 URL 数组、对象或 HTML');const r=await fetch(`/api/tasks/${currentTask.id}/browser-discovery`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),t=await r.json();if(!r.ok)throw Error(t.detail||'发现结果导入失败');importFailure('');renderTask(t)}catch(e){importFailure(e.message)}}
async function importPapers(){if(!currentTask||currentTask.mode!=='openreview'){importFailure('请先创建 OpenReview 任务');return}try{const value=readJsonOrHtml($('#papers-input').value);const papers=Array.isArray(value)?value:(value&&Array.isArray(value.papers)?value.papers:null);if(!papers)throw Error('论文快照必须是对象数组');const r=await fetch(`/api/tasks/${currentTask.id}/browser-papers`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({papers,complete:$('#import-complete').checked})}),t=await r.json();if(!r.ok)throw Error(t.detail||'论文快照导入失败');importFailure('');renderTask(t);renderResults(t)}catch(e){importFailure(e.message)}}
$('#import-discovery').onclick=importDiscovery;$('#import-papers').onclick=importPapers;
updateLabels();const pageParams=new URLSearchParams(location.search),requestedTask=pageParams.get('task');if(requestedTask){const requestedMode=pageParams.get('mode');if(requestedMode)$('#mode').value=requestedMode;updateLabels();beginPolling(requestedTask)}else{const saved=localStorage.getItem('crawlerTask');if(saved){try{const t=JSON.parse(saved);$('#mode').value=t.mode||'teacher';updateLabels();beginPolling(t.id)}catch{localStorage.removeItem('crawlerTask')}}}
</script></body></html>
